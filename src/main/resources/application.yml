spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/football_bot_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:liquibase/changelog.yaml

  jpa:
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: validate

domain:

  proxy:
    enabled: ${PROXY_ENABLED:false}
    host: ${PROXY_HOST:127.0.0.1}
    port: ${PROXY_PORT:10810}

  bot:
    name: ${BOT_NAME:botName}
    token: ${BOT_TOKEN:token}

  teams:
    - name: "csi"
      chat_id: -1001142763396
      day: Среда_21:00
      check-in-before-hours: 56
      send-team-report-before-hours: 1
      ignore-addition: false
      ignore-interrogation: false

    - name: "rostelecom"
      chat_id: -1003541602308
      day: Понедельник_21:00
      check-in-before-hours: 32
      send-team-report-before-hours: 1
      ignore-addition: false
      ignore-interrogation: false

    - name: "test"
      chat_id: -4250078193
      day: Пятница_21:00
      check-in-before-hours: 32
      send-team-report-before-hours: 1
      ignore-addition: false
      ignore-interrogation: false
